name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:


jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: pre-commit
        uses: pre-commit/action@v3.0.1

  codespell:
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: codespell
      run: |
        pip install codespell
        codespell --skip="*.js,*.csv,*.ipynb,*shaptxt*"
